[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chainwatch"
version = "1.0.0"
description = "Kill chain-aligned sequential detection for multi-step MCP attacks (arXiv:2607.19432v1)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pyyaml>=6.0"]

[project.optional-dependencies]
# Only the AgentLAB replay harness needs these; the proxy does not.
bench = [
    "pydantic[email]>=2.0",
    "docstring_parser>=0.16",
    "rich>=13.0",
    "openai>=1.0",
    "pandas>=2.0",
]
test = ["pytest>=8.0"]
# The supervised layer in chainwatch/ml/. Deliberately optional: chainwatch/engine/
# is numpy-only and stays that way, so the proxy runs without any of this.
# scikit-learn is xgboost's own requirement for its sklearn-style estimator API.
ml = ["xgboost>=2.0", "scikit-learn>=1.4"]
# Route E (Phase 17). AgentDojo is vendored at ./agentdojo and installed editable:
#     .venv/bin/pip install -e ./agentdojo
# It is imported only from agentdojo_bridge/, never from chainwatch/engine/, which
# stays numpy-only. Route F (InjecAgent) needs nothing here -- it reads that clone's
# data/*.json and never imports its src/.
agentdojo = ["agentdojo"]

[project.scripts]
# Installing the package puts a `chainwatch` binary next to the venv's python,
# which is what makes an MCP config entry independent of the working directory.
chainwatch = "chainwatch.cli:main"

[tool.setuptools]
packages = ["chainwatch", "chainwatch.engine", "chainwatch.proxy", "chainwatch.daemon", "chainwatch.ml", "chainwatch.capture", "agentlab_bridge"]

[tool.setuptools.package-data]
chainwatch = ["models/*.json"]
